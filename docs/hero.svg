<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TuneDrop — send music between your devices over your own Wi-Fi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1710"/>
      <stop offset="1" stop-color="#14100B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2A33C"/>
      <stop offset="1" stop-color="#C97F16"/>
    </linearGradient>
    <linearGradient id="amberline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2A33C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F2A33C" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F2A33C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1.5" y="1.5" width="1197" height="417" rx="26" fill="url(#bg)" stroke="#393122" stroke-width="1.5"/>

  <!-- faint decorative waveforms -->
  <g fill="#EDE6D8" opacity="0.05">
    <rect x="240" y="60" width="7" height="26" rx="3.5"/>
    <rect x="258" y="48" width="7" height="50" rx="3.5"/>
    <rect x="276" y="56" width="7" height="34" rx="3.5"/>
    <rect x="294" y="44" width="7" height="58" rx="3.5"/>
    <rect x="312" y="58" width="7" height="30" rx="3.5"/>
    <rect x="330" y="50" width="7" height="46" rx="3.5"/>
    <rect x="560" y="330" width="7" height="24" rx="3.5"/>
    <rect x="578" y="322" width="7" height="40" rx="3.5"/>
    <rect x="596" y="336" width="7" height="18" rx="3.5"/>
    <rect x="614" y="318" width="7" height="48" rx="3.5"/>
  </g>

  <!-- app mark -->
  <g transform="translate(84 156)">
    <rect x="0" y="0" width="104" height="104" rx="24" fill="url(#amber)"/>
    <path d="M 38 26 L 38 78 L 82 52 Z" fill="#16130F"/>
    <rect x="66" y="66" width="5.5" height="14" rx="2.75" fill="#EDE6D8"/>
    <rect x="76" y="60" width="5.5" height="26" rx="2.75" fill="#EDE6D8"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="220" y="205" font-family="'Segoe UI','Inter',system-ui,sans-serif" font-size="58" font-weight="700" fill="#EDE6D8">TuneDrop</text>
  <text x="222" y="248" font-family="'Segoe UI','Inter',system-ui,sans-serif" font-size="21" fill="#A99F8C">Send music from your phone to your PC — over your own Wi-Fi.</text>

  <!-- trust chips -->
  <g font-family="'Segoe UI','Inter',system-ui,sans-serif" font-size="15" font-weight="600">
    <rect x="222" y="286" width="118" height="36" rx="18" fill="none" stroke="#393122"/>
    <text x="281" y="309" text-anchor="middle" fill="#C9BFA9">no cloud</text>
    <rect x="356" y="286" width="128" height="36" rx="18" fill="none" stroke="#393122"/>
    <text x="420" y="309" text-anchor="middle" fill="#C9BFA9">no accounts</text>
    <rect x="500" y="286" width="168" height="36" rx="18" fill="none" stroke="#F2A33C" stroke-opacity="0.55"/>
    <text x="584" y="309" text-anchor="middle" fill="#F2A33C">your files stay home</text>
  </g>

  <!-- pair chip under the tagline -->
  <g font-family="'Segoe UI',monospace" font-size="17">
    <rect x="222" y="344" width="210" height="40" rx="12" fill="#252018" stroke="#393122"/>
    <circle cx="246" cy="364" r="6" fill="#F2A33C" opacity="0.9"/>
    <text x="266" y="371" fill="#EDE6D8" letter-spacing="6">428169</text>
  </g>

  <!-- laptop card -->
  <g transform="translate(608 150)">
    <rect x="0" y="0" width="186" height="118" rx="14" fill="#252018" stroke="#393122" stroke-width="1.5"/>
    <g fill="#F2A33C" opacity="0.85">
      <rect x="34" y="64" width="7" height="18" rx="3.5"/>
      <rect x="50" y="56" width="7" height="34" rx="3.5"/>
      <rect x="66" y="46" width="7" height="54" rx="3.5"/>
      <rect x="82" y="60" width="7" height="26" rx="3.5"/>
      <rect x="98" y="52" width="7" height="42" rx="3.5"/>
      <rect x="114" y="66" width="7" height="22" rx="3.5"/>
      <rect x="130" y="48" width="7" height="50" rx="3.5"/>
      <rect x="146" y="62" width="7" height="28" rx="3.5"/>
    </g>
    <rect x="24" y="20" width="96" height="9" rx="4.5" fill="#3A3226"/>

    <text x="93" y="148" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" fill="#6E6455">plays it out loud</text>
  </g>

  <!-- flow: the phone sends → the laptop plays -->
  <path d="M 932 209 C 900 209, 880 209, 808 209" stroke="url(#amberline)" stroke-width="3" fill="none" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M 802 209 L 816 201 L 816 217 Z" fill="#F2A33C"/>

  <!-- phone card -->
  <g transform="translate(940 96)">
    <rect x="0" y="0" width="126" height="228" rx="20" fill="#252018" stroke="#393122" stroke-width="1.5"/>
    <rect x="12" y="16" width="80" height="10" rx="5" fill="#3A3226"/>
    <rect x="12" y="38" width="102" height="34" rx="8" fill="#1C1710" stroke="#393122"/>
    <rect x="20" y="47" width="55" height="7" rx="3.5" fill="#A99F8C" opacity="0.7"/>
    <rect x="20" y="59" width="34" height="6" rx="3" fill="#6E6455"/>
    <rect x="12" y="80" width="102" height="34" rx="8" fill="#1C1710" stroke="#393122"/>
    <rect x="20" y="89" width="66" height="7" rx="3.5" fill="#A99F8C" opacity="0.7"/>
    <rect x="20" y="101" width="30" height="6" rx="3" fill="#6E6455"/>
    <rect x="12" y="122" width="102" height="34" rx="8" fill="#1C1710" stroke="#393122"/>
    <rect x="20" y="131" width="48" height="7" rx="3.5" fill="#A99F8C" opacity="0.7"/>
    <rect x="20" y="143" width="40" height="6" rx="3" fill="#6E6455"/>
    <rect x="20" y="178" width="86" height="24" rx="12" fill="url(#amber)"/>
    <text x="63" y="194" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="700" fill="#16130F">send</text>

    <text x="63" y="248" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" fill="#6E6455">picks a song</text>
  </g>

  <!-- headline strip -->
  <rect x="222" y="118" width="200" height="4" rx="2" fill="url(#amberline)"/>

  <!-- footer hairline -->
  <line x1="222" y1="392" x2="1132" y2="392" stroke="#2C2519" stroke-width="1"/>
</svg>
